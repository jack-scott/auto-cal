[workspace]
name = "auto-cal"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11"
gtsam = "==4.2.1"
opencv = ">=4.8"
numpy = ">=1.24"
pytest = ">=8.0"
hatchling = ">=1.21"
pyproj = ">=3.7.2,<4"

[pypi-dependencies]
piexif = ">=1.1"
py7zr = ">=0.21"
evo = ">=1.29"
foxglove-sdk = ">=0.22"
foxglove-schemas-protobuf = ">=0.1"
mcap-protobuf-support = ">=0.5"
autocal = { path = ".", editable = true }

# ---------------------------------------------------------------------------
# ETH3D pipes — undistorted PINHOLE
# ---------------------------------------------------------------------------

[tasks.eth3d-pipes-prepare]
cmd = ["python", "tools/prepare_dataset.py", "eth3d-pipes"]

[tasks.eth3d-pipes-sfm]
cmd = ["python", "pipelines/sfm.py",
       "data/eth3d_pipes.mcap",
       "data/eth3d_pipes_sfm.mcap"]
depends-on = ["eth3d-pipes-prepare"]

[tasks.eth3d-pipes-calibrate]
cmd = ["python", "pipelines/calibrate.py",
       "data/eth3d_pipes_sfm.mcap",
       "data/eth3d_pipes_calibrated.mcap"]
depends-on = ["eth3d-pipes-sfm"]

# ---------------------------------------------------------------------------
# ETH3D pipes — raw DSLR (THIN_PRISM_FISHEYE / equidistant)
# ---------------------------------------------------------------------------

[tasks.eth3d-pipes-raw-prepare]
cmd = ["python", "tools/prepare_dataset.py", "eth3d-pipes-raw"]

[tasks.eth3d-pipes-raw-sfm]
cmd = ["python", "pipelines/sfm.py",
       "data/eth3d_pipes_raw.mcap",
       "data/eth3d_pipes_raw_sfm.mcap"]
depends-on = ["eth3d-pipes-raw-prepare"]

[tasks.eth3d-pipes-raw-calibrate]
cmd = ["python", "pipelines/calibrate.py",
       "data/eth3d_pipes_raw_sfm.mcap",
       "data/eth3d_pipes_raw_calibrated.mcap"]
depends-on = ["eth3d-pipes-raw-sfm"]

# ---------------------------------------------------------------------------
# ETH3D exhibition hall — raw DSLR (Kannala-Brandt fisheye)
# ---------------------------------------------------------------------------

[tasks.eth3d-exhibition-hall-prepare]
cmd = ["python", "tools/prepare_dataset.py", "eth3d-exhibition-hall"]

[tasks.eth3d-exhibition-hall-sfm]
cmd = ["python", "pipelines/sfm.py",
       "data/eth3d_exhibition_hall.mcap",
       "data/eth3d_exhibition_hall_sfm.mcap"]
depends-on = ["eth3d-exhibition-hall-prepare"]

[tasks.eth3d-exhibition-hall-calibrate]
cmd = ["python", "pipelines/calibrate.py",
       "data/eth3d_exhibition_hall_sfm.mcap",
       "data/eth3d_exhibition_hall_calibrated.mcap"]
depends-on = ["eth3d-exhibition-hall-sfm"]

[tasks.eth3d-exhibition-hall-perturb]
cmd = ["python", "tools/perturb_mcap.py",
       "data/eth3d_exhibition_hall.mcap",
       "data/eth3d_exhibition_hall_noisy.mcap",
       "--pose-noise-m", "0.1",
       "--pose-noise-rad", "0.05"]
depends-on = ["eth3d-exhibition-hall-prepare"]

[tasks.eth3d-exhibition-hall-noisy-sfm]
cmd = ["python", "pipelines/sfm.py",
       "data/eth3d_exhibition_hall_noisy.mcap",
       "data/eth3d_exhibition_hall_noisy_sfm.mcap",
       "--reproj-filter-px", "0",
       "--max-landmark-dist", "100",
       "--min-parallax-deg", "2",
       "--huber-loss"]
depends-on = ["eth3d-exhibition-hall-perturb"]

# ---------------------------------------------------------------------------
# Caliterra — UAV nadir survey (Canon SX260 HS, GPS)
# ---------------------------------------------------------------------------

[tasks.caliterra-prepare]
cmd = ["python", "tools/prepare_dataset.py", "caliterra"]

[tasks.caliterra-sfm]
cmd = ["python", "pipelines/sfm.py",
       "data/caliterra.mcap",
       "data/caliterra_sfm.mcap"]
depends-on = ["caliterra-prepare"]

[tasks.caliterra-calibrate]
cmd = ["python", "pipelines/calibrate.py",
       "data/caliterra_sfm.mcap",
       "data/caliterra_calibrated.mcap"]
depends-on = ["caliterra-sfm"]

# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------

[tasks.test]
cmd = ["pytest", "tests/", "-v"]
