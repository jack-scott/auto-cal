[workspace]
name = "auto-cal"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11"
gtsam = "==4.2.1"
opencv = ">=4.8"
numpy = ">=1.24"
pytest = ">=8.0"
hatchling = ">=1.21"
pyproj = ">=3.7.2,<4"

[pypi-dependencies]
piexif = ">=1.1"
py7zr = ">=0.21"
foxglove-sdk = ">=0.22"
foxglove-schemas-protobuf = ">=0.1"
mcap-protobuf-support = ">=0.5"
autocal = { path = ".", editable = true }

# --- Caliterra (ODM UAV nadir survey, Canon SX260 HS + GPS) -----------------

[tasks.caliterra-download]
cmd = ["python", "tools/download_dataset.py"]

[tasks.caliterra-convert]
cmd = ["python", "tools/convert_to_mcap.py"]
depends-on = ["caliterra-download"]

[tasks.caliterra-calibrate]
cmd = ["python", "tools/run_calibration.py",
       "data/caliterra.mcap",
       "data/caliterra_calibrated.mcap",
       "--nadir"]
depends-on = ["caliterra-convert"]

# --- ETH3D pipes (indoor DSLR, COLMAP PINHOLE intrinsics, no GPS) -----------

[tasks.pipes-download]
cmd = ["python", "tools/download_eth3d_pipes.py"]

[tasks.pipes-calibrate]
cmd = ["python", "tools/run_calibration.py",
       "data/eth3d_pipes.mcap",
       "data/eth3d_pipes_calibrated.mcap"]
depends-on = ["pipes-download"]

# --- Misc -------------------------------------------------------------------

[tasks.test]
cmd = ["pytest", "tests/", "-v"]
